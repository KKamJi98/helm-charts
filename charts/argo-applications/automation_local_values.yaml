destinationNamespace: argocd
destinationServer: https://kubernetes.default.svc
project: automation

syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true

applications:
  n8n:
    enabled: true
    name: n8n
    project: automation
    destination:
      namespace: n8n
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/n8n
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  openclaw:
    enabled: false
    name: openclaw
    project: automation
    destination:
      namespace: openclaw
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/openclaw
      helm:
        valueFiles:
          - kkamji_local_values.yaml
    # 차트의 gateway.auth.generateSecret 은 lookup 기반인데 ArgoCD repo-server 는
    # 클러스터 접근 없이 렌더하므로 매번 randAlphaNum 으로 새 토큰이 생성된다.
    # data diff 를 무시해 sync 마다 토큰이 rotate 되는 것을 막는다.
    syncPolicy:
      syncOptions:
        - RespectIgnoreDifferences=true
    ignoreDifferences:
      - kind: Secret
        name: openclaw-gateway-auth
        jsonPointers:
          - /data

  arc-foundation:
    enabled: true
    name: arc-foundation
    project: arc-ci
    destination:
      namespace: arc-system
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/arc-foundation
      helm:
        valueFiles:
        - kkamji_local_values.yaml
  arc-controller:
    enabled: true
    name: arc-controller
    project: arc-ci
    destination:
      namespace: arc-system
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/arc-controller
      helm:
        valueFiles:
        - kkamji_local_values.yaml
        skipCrds: false
  arc-light:
    enabled: true
    name: arc-light
    project: arc-ci
    destination:
      namespace: ci-pr
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/arc-light
      helm:
        valueFiles:
        - kkamji_local_values.yaml
  arc-bql-light:
    enabled: true
    name: arc-bql-light
    project: arc-ci
    destination:
      namespace: ci-pr
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/arc-bql-light
      helm:
        valueFiles:
        - kkamji_local_values.yaml

  arc-runtime:
    enabled: true
    name: arc-runtime
    project: arc-ci
    destination:
      namespace: arc-runtime
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/arc-runtime
      helm:
        valueFiles:
        - kkamji_local_values.yaml

  arc-full:
    enabled: true
    name: arc-full
    project: arc-ci
    destination:
      namespace: ci-full
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/arc-full
      helm:
        valueFiles:
        - kkamji_local_values.yaml
        skipCrds: true
