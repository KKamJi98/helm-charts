destinationNamespace: argocd
destinationServer: https://kubernetes.default.svc
project: management

syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true

applications:
  # ---------- argocd project (self-management) ----------
  argocd:
    enabled: true
    name: argocd
    project: argocd
    destination:
      namespace: argocd
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/argocd
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  # NOTE: argo-projects (AppProject CRs) and root-applications (local-root,
  # kuberca-root meta) are bundled into the argo-cd umbrella chart as subcharts.
  # No separate Applications needed here.

  # ---------- management project ----------
  cilium:
    enabled: true
    name: cilium
    project: management
    destination:
      namespace: kube-system
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/cilium
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  metallb:
    enabled: true
    name: metallb
    project: management
    destination:
      namespace: metallb-system
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/metallb
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  cloudnative-pg:
    enabled: true
    name: cloudnative-pg
    project: management
    destination:
      namespace: cnpg-system
    source:
      repoURL: ghcr.io/cloudnative-pg/charts
      chart: cloudnative-pg
      targetRevision: 0.29.0

  keycloak-operator:
    enabled: true
    name: keycloak-operator
    project: management
    destination:
      namespace: keycloak
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/keycloak-operator
      helm:
        releaseName: keycloak-operator
        valueFiles:
          - kkamji_local_values.yaml

  keycloak-idp:
    enabled: true
    name: keycloak-idp
    project: management
    destination:
      namespace: keycloak
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/keycloak-idp
      helm:
        releaseName: keycloak
        valueFiles:
          - kkamji_local_values.yaml
          - production-values.yaml
        parameters:
          - name: productionPhase
            value: application
            forceString: true

  keycloak-admin-access:
    enabled: true
    name: keycloak-admin-access
    project: management
    destination:
      namespace: envoy-gateway-system
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/keycloak-admin-access
      helm:
        releaseName: keycloak-admin-access
        valueFiles:
          - kkamji_local_values.yaml

  keycloak-public-access:
    enabled: true
    name: keycloak-public-access
    project: management
    destination:
      namespace: keycloak
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/keycloak-public-access
      helm:
        releaseName: keycloak-public-access
        valueFiles:
          - kkamji_local_values.yaml

  metrics-server:
    enabled: true
    name: metrics-server
    project: management
    destination:
      namespace: kube-system
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/metrics-server
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  # Envoy Gateway 로 전면 전환 완료 - chart 는 _archived/ 로 이동
  ingress-nginx:
    enabled: false
    name: ingress-nginx
    project: management
    destination:
      namespace: ingress-nginx
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/ingress-nginx
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  # Envoy Gateway (Gateway API) - ingress-nginx 대체 진행 중 (Stage A: 병행 기동)
  envoy-gateway:
    enabled: true
    name: envoy-gateway
    project: management
    destination:
      namespace: envoy-gateway-system
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/envoy-gateway
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  external-dns:
    enabled: true
    name: external-dns
    project: management
    destination:
      namespace: external-dns
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/external-dns
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  external-secrets:
    enabled: true
    name: external-secrets
    project: management
    annotations:
      argocd.argoproj.io/sync-wave: "-2"
    destination:
      namespace: external-secrets
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/external-secrets
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  cert-manager:
    enabled: true
    name: cert-manager
    project: management
    annotations:
      argocd.argoproj.io/sync-wave: "-4"
    destination:
      namespace: cert-manager
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/cert-manager
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  istio-base:
    enabled: true
    name: istio-base
    project: management
    annotations:
      argocd.argoproj.io/sync-wave: "-1"
    destination:
      namespace: istio-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istiod-default-validator
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].failurePolicy
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istio-validator-istio-system
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].failurePolicy
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/istio-base
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  istio-istiod:
    enabled: true
    name: istio-istiod
    project: management
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    destination:
      namespace: istio-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istio-validator-istio-system
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].failurePolicy
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/istio-istiod
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  istio-cni:
    enabled: true
    name: istio-cni
    project: management
    annotations:
      argocd.argoproj.io/sync-wave: "1"
    destination:
      namespace: istio-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/istio-cni
      helm:
        releaseName: istio-cni
        valueFiles:
          - kkamji_local_values.yaml

  istio-ztunnel:
    enabled: true
    name: istio-ztunnel
    project: management
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    destination:
      namespace: istio-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/istio-ztunnel
      helm:
        releaseName: ztunnel
        valueFiles:
          - kkamji_local_values.yaml

  kube-prometheus-stack:
    enabled: true
    name: kube-prometheus-stack
    project: management
    destination:
      namespace: monitoring
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/kube-prometheus-stack
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  alloy:
    enabled: true
    name: alloy
    project: management
    destination:
      namespace: monitoring
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/alloy
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  loki:
    enabled: true
    name: loki
    project: management
    destination:
      namespace: monitoring
    source:
      repoURL: https://github.com/KKamJi98/helm-charts.git
      targetRevision: main
      path: charts/loki
      helm:
        valueFiles:
          - kkamji_local_values.yaml

  # NOTE: openclaw → automation-root, play-hub & lf-oss-na-2026 → personal-root.
