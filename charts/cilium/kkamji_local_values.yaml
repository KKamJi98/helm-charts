cilium:
  # Pin upgrade compatibility to 1.18 during the 1.19 transition; remove
  # in a follow-up PR after the 1.19 stability window closes.
  upgradeCompatibility: "1.18"

  # Enable automatic direct routes for pods when native routing is active.
  autoDirectNodeRoutes: true

  bgpControlPlane:
    # Disabled on homelab (2026-11-23): zero BGP policies/routers exist; MetalLB uses L2 only.
    enabled: false

  # Skip unreachable nodes when programming native direct routes.
  directRoutingSkipUnreachable: true

  endpointRoutes:
    # Prefer per-endpoint routes instead of hairpinning via cilium_host.
    enabled: true

  endpointHealthChecking:
    # Disable endpoint health probes to reduce datapath noise.
    enabled: false

  # Disable legacy agent connectivity checks.
  healthChecking: false

  # Run the kube-proxy replacement datapath.
  kubeProxyReplacement: true

  # Istio Ambient Mode compatibility (2026-11-23):
  # - cni.exclusive=false allows istio-cni to chain in /etc/cni/net.d/.
  # - socketLB.hostNamespaceOnly=true keeps pod traffic visible to ztunnel redirection.
  # - bpf.masquerade=false + installNoConntrackIptablesRules=false avoid conntrack/probe
  #   conflicts with chained istio-cni and ambient 169.254.7.127 host-probe SNAT.
  cni:
    exclusive: false

  socketLB:
    hostNamespaceOnly: true

  bpf:
    masquerade: false

  installNoConntrackIptablesRules: false

  # Advertise the workload pod CIDR through native routing.
  ipv4NativeRoutingCIDR: 10.233.64.0/18

  # Operate in native routing mode rather than tunneling.
  routingMode: native

  # cilium-operator는 'auto' 매직값을 처리 못 해서 control-plane endpoint를 명시.
  # 단일 master 환경: k8s-m1 (10.0.0.101). HA로 전환 시 VIP/LB로 변경 필요.
  k8sServiceHost: 10.0.0.101
  k8sServicePort: 6443

  ipam:
    # Use cluster-pool IPAM managed by the operator.
    mode: cluster-pool
    operator:
      # Restrict IPv4 allocations to the desired pod CIDR.
      clusterPoolIPv4PodCIDRList:
      - 10.233.64.0/18

  # l2announcements:
  #   enabled: true

  # Allow node-local redirect policies for fast-path services.
  localRedirectPolicy: true

  # ingressController:
  #   enabled: true
  #   loadbalancerMode: shared

  # loadBalancer:
  #   l7:
  #     backend: envoy

  debug:
    # Disabled on steady-state homelab (2026-11-23) to reduce cilium-agent CPU/RAM/log churn on k8s-m1 and workers.
    enabled: false

  hubble:
    # Keep Hubble datapath visibility enabled.
    enabled: true
    relay:
      # Run Hubble relay for aggregated flow export.
      enabled: true
      resources:
        requests:
          cpu: 5m
          memory: 24Mi
        limits:
          memory: 160Mi
    ui:
      # Deploy the Hubble UI.
      enabled: true
      backend:
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            memory: 160Mi
      frontend:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
      service:
        # ClusterIP only; external access via Ingress below.
        type: ClusterIP
      # 외부 노출은 Envoy Gateway HTTPRoute(charts/envoy-gateway)가 담당
      # (TLS 종료 + SecurityPolicy basic-auth 포함)
    metrics:
      # Publish metrics using the OpenMetrics endpoint.
      enableOpenMetrics: true
      # Enable flow-level metrics including HTTP exemplars.
      enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - 'httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction'
      # Expose Hubble metrics via Prometheus ServiceMonitor.
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
      # Ship Hubble Grafana dashboards into the monitoring namespace.
      dashboards:
        enabled: true
        namespace: monitoring
    tls:
      auto:
        # 기본 method(helm)는 매 렌더마다 genCA 로 인증서를 재생성해
        # ArgoCD 에서 커밋마다 가짜 diff -> auto-sync -> 알림을 유발한다.
        # certgen CronJob 에 위임해 렌더를 결정적으로 만든다.
        method: cronJob

  # Cilium agent metrics + ServiceMonitor.
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      # helm template cannot introspect cluster CRDs; monitoring.coreos.com/v1
      # is provided by kube-prometheus-stack.
      trustCRDsExist: true

  # Cilium operator: non-HA single replica on worker nodes only (relieves k8s-m1 RAM).
  operator:
    replicas: 1
    affinity: null
    tolerations: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    dashboards:
      enabled: true
      namespace: monitoring

  # Cilium agent Grafana dashboards.
  dashboards:
    enabled: true
    namespace: monitoring

# Gateway API 라우트 (앱 차트 소유 원칙 - templates/gateway-routes.yaml).
# 플랫폼 Gateway 의 wildcard 리스너(sectionName: https)에 붙는다.
gatewayRef:
  name: kkamji
  namespace: envoy-gateway-system
  sectionName: https

gatewayRoutes:
  hubble:
    host: hubble.kkamji.net
    backend: { name: hubble-ui, port: 80 }
    basicAuth: true
