{{- if and .Values.enabled .Values.externalSecrets.enabled }}
{{- range $entry := list (dict "name" "hindsight-dot-runtime" "props" (list "oauth_redis_url" "gate_redis_url" "storage_key" "signing_key" "google_client_secret")) (dict "name" "hindsight-dot-redis-acl" "props" (list "users.acl")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ $entry.name }}, namespace: {{ $.Release.Namespace }}}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $.Values.externalSecrets.store }}, kind: ClusterSecretStore}
  target: {name: {{ $entry.name }}, creationPolicy: Orphan, deletionPolicy: Retain}
  data:
    {{- range $entry.props }}
    - secretKey: {{ . | quote }}
      remoteRef: {key: {{ $.Values.externalSecrets.runtimeSource | quote }}, property: {{ ternary "redis_acl" . (eq . "users.acl") | quote }}}
    {{- end }}
{{- end }}
{{- if not .Values.syntheticBackend }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: hindsight-dot-native, namespace: {{ .Release.Namespace }}}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ .Values.externalSecrets.store }}, kind: ClusterSecretStore}
  target: {name: hindsight-dot-native, creationPolicy: Orphan, deletionPolicy: Retain}
  data:
    - secretKey: api_key
      remoteRef: {key: {{ .Values.externalSecrets.nativeSource | quote }}, property: api_key}
{{- end }}
{{- end }}
