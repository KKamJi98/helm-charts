{{- if .Values.enabled }}
{{- if ne .Release.Namespace "hindsight-dot" }}{{ fail "namespace must be hindsight-dot" }}{{ end }}
{{- $repo := required "image repository required" .Values.image.repository }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}{{ fail "image digest required" }}{{ end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.redis.digest) }}{{ fail "redis digest required" }}{{ end }}
{{- if not .Values.owner.fromSecret }}{{- $sub := required "owner sub required" .Values.owner.sub }}{{- end }}
{{- if and .Values.owner.fromSecret .Values.bootstrapIdentityDiagnostic }}{{ fail "secret owner cannot use bootstrap diagnostic" }}{{ end }}
{{- if and .Values.owner.fromSecret (not .Values.externalSecrets.enabled) }}{{ fail "secret owner requires external secrets" }}{{ end }}
{{- if and .Values.durableRegistration (or (not .Values.syntheticBackend) (not .Values.owner.fromSecret)) }}{{ fail "durable registration requires bound synthetic owner" }}{{ end }}
{{- $client := required "google client required" .Values.googleClientId }}
{{- if empty .Values.redirectUris }}{{ fail "exact redirects required" }}{{ end }}
{{- range .Values.redirectUris }}{{ if or (not (hasPrefix "https://" .)) (contains "*" .) (contains "[" .) (contains "]" .) (contains "#" .) }}{{ fail "exact HTTPS redirects required" }}{{ end }}{{ end }}
{{- if lt (int .Values.epoch) 1 }}{{ fail "positive epoch required" }}{{ end }}
{{- if empty .Values.capabilities }}{{ fail "capabilities required" }}{{ end }}
{{- range .Values.capabilities }}{{ if not (has . (list "hindsight:recall" "hindsight:retain")) }}{{ fail "invalid capability" }}{{ end }}{{ end }}
{{- if and (not .Values.syntheticBackend) (not .Values.native.approved) }}{{ fail "native approval required" }}{{ end }}
{{- if and .Values.publicRoute.enabled (not .Values.publicRoute.networkValidated) }}{{ fail "network validation required" }}{{ end }}
{{- if .Values.bootstrapIdentityDiagnostic }}
{{- if not .Values.syntheticBackend }}{{ fail "bootstrap diagnostic requires synthetic backend" }}{{ end }}
{{- if ne .Values.owner.sub "bootstrap-unverified-deny-all" }}{{ fail "bootstrap diagnostic requires deny-all owner sentinel" }}{{ end }}
{{- if or (ne (len .Values.capabilities) 1) (ne (first .Values.capabilities) "hindsight:recall") }}{{ fail "bootstrap diagnostic requires recall-only capability" }}{{ end }}
{{- end }}
{{- end }}
