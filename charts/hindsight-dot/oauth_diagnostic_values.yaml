# Diagnostic deny-all bootstrap cannot use owner-bound durable registration.
durableRegistration: false
# Owner-approved public synthetic identity diagnostic only.
# Node administrators/local host processes remain trusted.
bootstrapIdentityDiagnostic: true
syntheticBackend: true
owner:
  fromSecret: false
  sub: bootstrap-unverified-deny-all
capabilities: [hindsight:recall]
redirectUris: [https://chatgpt.com/connector_platform_oauth_redirect]
publicRoute:
  enabled: true
  hostname: hindsight-dot.kkamji.net
  networkValidated: true
native:
  approved: false
