{{/*
모니터링 스택의 HTTPRoute - 앱 차트가 자기 라우팅을 소유한다 (Gateway API
persona model). 플랫폼 Gateway(charts/envoy-gateway)의 wildcard 리스너에
sectionName: https 로 붙는다. group/kind/weight 는 API server defaulting 과
일치시켜 ArgoCD diff 를 방지. basic auth 는 templates/security-policy.yaml.
*/}}
{{- $root := . }}
{{- range $name, $r := .Values.gatewayRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $root.Values.gatewayRef.name }}
      namespace: {{ $root.Values.gatewayRef.namespace }}
      sectionName: {{ $root.Values.gatewayRef.sectionName }}
  hostnames:
    - {{ $r.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if and (eq $name "grafana") (ne $root.Values.keycloakSSO.grafana.mode "legacy") }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            {{- $remove := include "grafana-keycloak.untrustedHeaders" $root | fromJsonArray }}
            {{- if eq $root.Values.keycloakSSO.grafana.mode "only" }}
            # Lua injected this one signed token. Remove every alternative credential.
            remove: {{ concat (without $remove "X-Grafana-Keycloak-Id-Token") (list "Cookie" "Authorization") | toJson }}
            {{- else }}
            # Normal canary traffic remains legacy, but cannot spoof the new JWT path.
            remove: {{ $remove | toJson }}
            {{- end }}
      {{- else if and (has $name (list "prometheus" "alertmanager")) (eq (index $root.Values.keycloakSSO $name).mode "only") }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-Forwarded-User, X-Forwarded-Email, X-Forwarded-Groups, X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups]
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $r.backend.name }}
          port: {{ $r.backend.port }}
          weight: 1
{{- end }}
