# Activation candidate only. Do not merge/deploy before verified data recovery and final consistent copy.
grafanaPvcPreparation: true

kube-prometheus-stack:
  alertmanager:
    # 외부 노출은 Envoy Gateway HTTPRoute(charts/envoy-gateway)가 담당
    alertmanagerSpec:
      # Prometheus Operator v0.94 validates Discord config before Alertmanager
      # starts and cannot parse webhook_url_file. ESO renders the complete
      # Alertmanager config with SSM values only inside the cluster.
      configSecret: alertmanager-discord-config
      priorityClassName: kkamji-observability
      configMaps:
        - alertmanager-discord-template
      # Persist silences and notification state across pod replacements.
      # nflog 보존 기간. route 의 최대 repeat_interval(12h) 보다 길게 유지한다.
      retention: 24h
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      # Discord 메시지의 Silence 링크(.ExternalURL)가 외부 도메인을 가리키도록 설정
      externalUrl: https://alertmanager.kkamji.net
      # Homelab right-sizing (2026-11-23): live 1m / 43Mi vs 10m / 200Mi.
      resources:
        requests:
          cpu: 5m
          memory: 80Mi
        limits:
          memory: 192Mi
    # Runtime Alertmanager configuration and templates are rendered only by
    # templates/alertmanager-discord-ces.yaml. Keep no duplicate config here.
  grafana:
    # Candidate only: parent must accept real copy/restore/crypto and final write consistency.
    replicas: 1
    deploymentStrategy:
      type: Recreate
      rollingUpdate: null
    persistence:
      enabled: true
      type: pvc
      existingClaim: '{{ include "grafana.fullname" . }}'
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    # Upstream otherwise adds root init-chown-data on activation. Copy preserves ownership.
    initChownData:
      enabled: false
    priorityClassName: kkamji-observability
    admin:
      existingSecret: grafana-auth
      userKey: admin-user
      passwordKey: admin-password
    defaultDashboardsTimezone: browser # TimeZone 설정 (default: UTC)
    additionalDataSources:
      - name: Loki
        # Discord 알림의 Logs explore 딥링크가 uid 를 참조하므로 고정한다
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway:80
        jsonData:
          timeout: 60
          maxLines: 1000
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "kube-rca"
    sidecar:
      dashboards:
        folderAnnotation: "grafana_folder"
        defaultFolderName: "Default Dashboard"
        provider:
          foldersFromFilesStructure: true
  prometheus:
    prometheusSpec:
      # 알림의 Query 링크(.GeneratorURL)가 외부 도메인을 가리키도록 설정
      externalUrl: https://prometheus.kkamji.net
      priorityClassName: kkamji-observability
      # Persist the local TSDB across pod replacements.
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 30Gi
      additionalScrapeConfigs:
        # Hubble & Cilium Metric 수집을 위한 설정
        - job_name: "kubernetes-pods" ## Cilium
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            # prometheus.io/path annotation 존중 (없으면 기본 /metrics).
            # envoy 류 pod 는 /stats/prometheus 를 쓰므로 이 매핑이 없으면 404 → up==0.
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              regex: (.+)
              target_label: __metrics_path__
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: ${1}:${2}
              target_label: __address__
            # namespace/pod 라벨이 없으면 TargetDown 류 알림에서 어떤 pod 인지
            # 식별 불가 ("in  namespace" 빈 칸 문제) → up 시계열에 라벨을 입힌다
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
        - job_name: "kubernetes-endpoints" ## Hubble
          scrape_interval: 30s
          kubernetes_sd_configs:
            - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: (.+)(?::\d+);(\d+)
              replacement: $1:$2
        # Istio Ambient Mode telemetry (2026-11-23): legacy sidecar envoy-stats job removed.
        # ztunnel (:15020/metrics) and istio-cni-node (:15014/metrics) carry prometheus.io/scrape=true
        # and are scraped by kubernetes-pods; istiod control-plane metrics are scraped below.
        - job_name: "istiod"
          kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names:
                  - istio-system
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: istiod;http-monitoring
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
      retention: 1d
      # 시간 기준 retention 과 별개로 TSDB 블록 크기 상한을 둔다 (PVC 30Gi).
      retentionSize: 10GB
      # Homelab right-sizing (2026-11-23): bounded after dropping unused apiserver buckets.
      resources:
        requests:
          cpu: 25m
          memory: 768Mi
        limits:
          memory: 1536Mi
  # Drop unused high-cardinality apiserver histogram buckets (~27.8k series, 22% of TSDB)
  # while preserving upstream noisy-le bucket drops and all SLO/recording rule metrics.
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - action: drop
          regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          sourceLabels:
            - __name__
            - le
        - action: drop
          regex: apiserver_(watch_events_dispatch_duration_seconds|watch_list_duration_seconds|storage_list_duration_seconds|response_sizes|watch_cache_read_wait_seconds|watch_cache_initialization_duration_seconds|request_body_size_bytes)_bucket
          sourceLabels:
            - __name__
  # CrashLoopBackOff 전용 알람을 복원한다 (이전에 disabled 였으나, pod 단위
  # crashloop 신호가 없으면 KubePodNotReady 등 간접 알람만 남아 추적이 어렵다).
  defaultRules:
    disabled:
      # Replaced below under the same alert name, duration, labels and annotations.
      # Only proven recovered Jobs owned by the exact RPG CronJob are excluded.
      KubeJobFailed: true

  # 기본 TargetDown 은 job/namespace 단위 집계라 어떤 target 이 죽었는지 안 보인다.
  # per-target 룰을 추가하고, TargetDown 은 inhibit_rules 로 억제한다 (안전망으로 유지).
  # keep_firing_for 로 resolve 직후 재발화(flapping) 시 중복 알림을 막는다.
  additionalPrometheusRulesMap:
    kkamji-job-failed:
      groups:
        - name: kkamji.job-failed
          rules:
            - alert: KubeJobFailed
              # Preserve the upstream signal for every Job unless all recovery
              # evidence exists. No name-prefix exclusion or blanket silence.
              # Aggregate exporter replicas before joins; keep cluster isolation.
              expr: |-
                (kube_job_failed{job="kube-state-metrics", namespace=~".*"} > 0)
                unless on (cluster, namespace, job_name)
                (
                  (
                    max by (cluster, namespace, job_name) (
                      kube_job_status_start_time{job="kube-state-metrics", namespace="real-life-rpg"} > 0
                    )
                    < on (cluster, namespace) group_left ()
                    max by (cluster, namespace) (
                      kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="real-life-rpg", cronjob="real-life-rpg-scheduler"} > 0
                    )
                  )
                  and on (cluster, namespace, job_name)
                  max by (cluster, namespace, job_name) (
                    kube_job_owner{job="kube-state-metrics", namespace="real-life-rpg", owner_kind="CronJob", owner_name="real-life-rpg-scheduler", owner_is_controller="true"} == 1
                  )
                )
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: 'Job failed to complete.'
                description: 'Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete. Removing failed job after investigation should clear this alert on cluster {{ $labels.cluster }}.'
                runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
    kkamji-scrape-target:
      groups:
        - name: kkamji.scrape-target
          rules:
            - alert: ScrapeTargetDown
              expr: up == 0
              for: 5m
              keep_firing_for: 5m
              labels:
                severity: warning
              annotations:
                summary: 'Scrape target down ({{ $labels.job }})'
                description: '{{ if $labels.pod }}Pod {{ $labels.namespace }}/{{ $labels.pod }}{{ else }}Target {{ $labels.instance }}{{ end }} (job `{{ $labels.job }}`) has been unreachable for 5 minutes.'

  # Cilium kubeProxyReplacement 환경 - kube-proxy 가 없으므로 scrape 대상과
  # KubeProxyDown 룰 자체를 생성하지 않는다 (영구 firing 노이즈 제거).
  kubeProxy:
    enabled: false

  prometheusOperator:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi

  kube-state-metrics:
    priorityClassName: kkamji-observability
    resources:
      requests:
        cpu: 10m
        memory: 96Mi

  prometheus-node-exporter:
    priorityClassName: kkamji-observability
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

# templates/priorityclass.yaml. 값은 system-*-critical(2e9)과 kubespray 의
# k8s-cluster-critical(1e9)보다 낮고 기본값 0 보다 높게 둔다.
observabilityPriorityClass:
  enabled: true
  name: kkamji-observability
  value: 100000
  description: "kkamji observability stack (prometheus, alertmanager, grafana, loki, alloy)"

basicAuth:
  ssmKey: /kkamji/monitoring/ingress/basic-auth
  # Envoy Gateway basic auth 용 {SHA} 형식 htpasswd (htpasswd -nbs 로 생성)
  shaSsmKey: /kkamji/monitoring/ingress/basic-auth-sha
  namespaces:
    - monitoring
    - kube-system

grafanaAuth:
  adminUserSsmKey: /kkamji/monitoring/grafana/admin-user
  adminPasswordSsmKey: /kkamji/monitoring/grafana/admin-password

# Alertmanager Discord webhooks (personal server). severity 로 critical / warning
# webhook 분기. ESO 가 SSM webhook URL을 complete config Secret으로 렌더하고,
# Alertmanager template는 ConfigMap으로 mount한다. Secret 값은 Git에 저장하지 않는다.
alertmanagerDiscord:
  criticalSsmKey: /kkamji/monitoring/discord/alertmanager-critical-webhook
  warningSsmKey: /kkamji/monitoring/discord/alertmanager-warning-webhook
  template: |-
    {{ define "discord.kkamji.title" -}}
    {{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}{{ if .CommonLabels.namespace }} ({{ .CommonLabels.namespace }}){{ end }}
    {{- end }}

    {{ define "discord.kkamji.message" -}}
    {{ $ext := .ExternalURL -}}
    {{ range .Alerts -}}
    `{{ .Labels.severity }}` {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
    {{- if and .Annotations.description (ne .Annotations.description .Annotations.summary) }}
    {{ .Annotations.description }}{{ end }}
    {{- if .Labels.pod }}
    Target: `{{ .Labels.namespace }}/{{ .Labels.pod }}`
    {{- else if .Labels.instance }}
    Target: `{{ .Labels.instance }}`{{ if .Labels.job }} (job `{{ .Labels.job }}`){{ end }}
    {{- else if .Labels.job }}
    Target: job `{{ .Labels.job }}`{{ if .Labels.service }} / svc `{{ .Labels.service }}`{{ end }}{{ if .Labels.namespace }} in `{{ .Labels.namespace }}`{{ end }}
    {{- else if .Labels.namespace }}
    Namespace: `{{ .Labels.namespace }}`{{ end }}
    {{- if eq .Status "firing" }}
    Started: {{ (.StartsAt | tz "Asia/Seoul").Format "01-02 15:04" }} KST ({{ humanizeDuration (since .StartsAt).Seconds }} ago)
    {{- else }}
    Duration: {{ humanizeDuration (.EndsAt.Sub .StartsAt).Seconds }} ({{ (.StartsAt | tz "Asia/Seoul").Format "01-02 15:04" }} ~ {{ (.EndsAt | tz "Asia/Seoul").Format "15:04" }} KST)
    {{- end }}
    {{ if .Annotations.runbook_url }}[Runbook]({{ .Annotations.runbook_url }}) · {{ end }}[Query]({{ .GeneratorURL }}){{ if .Labels.pod }} · [Logs](https://grafana.kkamji.net/explore?schemaVersion=1&orgId=1&panes={{ printf `{"a":{"datasource":"loki","queries":[{"refId":"A","expr":"{namespace=\"%s\", pod=\"%s\"}","datasource":{"type":"loki","uid":"loki"}}],"range":{"from":"now-3h","to":"now"}}}` .Labels.namespace .Labels.pod | urlquery }}){{ end }} · [Silence]({{ $ext }}/#/silences/new?filter={{ printf "{alertname=%q}" .Labels.alertname | urlquery }})

    {{ end }}
    {{- end }}

# Gateway API 라우트 (앱 차트 소유 원칙 - templates/gateway-routes.yaml).
# 플랫폼 Gateway 의 wildcard 리스너(sectionName: https)에 붙는다.
gatewayRef:
  name: kkamji
  namespace: envoy-gateway-system
  sectionName: https

gatewayRoutes:
  grafana:
    host: grafana.kkamji.net
    backend: { name: kube-prometheus-stack-grafana, port: 80 }
  prometheus:
    host: prometheus.kkamji.net
    backend: { name: kube-prometheus-stack-prometheus, port: 9090 }
    basicAuth: true
  alertmanager:
    host: alertmanager.kkamji.net
    backend: { name: kube-prometheus-stack-alertmanager, port: 9093 }
    basicAuth: true
