{{- /* kkamji: master key 를 SSM 에서 ESO 로 주입한다 (upstream chart 에 없는 로컬 추가 템플릿). */ -}}
{{- with .Values.kkamjiMasterKeyExternalSecret }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.masterkeySecretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .secretStoreRef.name }}
    kind: {{ .secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $.Values.masterkeySecretName }}
    template:
      type: Opaque
      data:
        {{ $.Values.masterkeySecretKey }}: '{{ printf "{{ .%s }}" $.Values.masterkeySecretKey }}'
  data:
    - secretKey: {{ $.Values.masterkeySecretKey }}
      remoteRef:
        key: {{ .ssmKey }}
{{- end }}
{{- end }}
