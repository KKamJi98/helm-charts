githubConfigUrl: https://github.com/KKamJi98/kkamji-platform
githubConfigSecret: arc-github-app-auth
runnerScaleSetName: kkamji-platform-light
minRunners: 0
maxRunners: 1
controllerServiceAccount:
  namespace: arc-system
  name: arc-controller
listenerTemplate:
  metadata:
    labels:
      arc.kkamji.net/role: control
  spec:
    nodeSelector:
      kubernetes.io/hostname: k8s-w2
    priorityClassName: arc-ci-nonpreempting
    preemptionPolicy: Never
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    containers:
    - name: listener
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
          ephemeral-storage: 128Mi
template:
  metadata:
    labels:
      arc.kkamji.net/role: job
  spec:
    automountServiceAccountToken: false
    serviceAccountName: arc-light-job
    nodeSelector:
      kubernetes.io/hostname: k8s-w2
    priorityClassName: arc-ci-nonpreempting
    preemptionPolicy: Never
    terminationGracePeriodSeconds: 30
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    initContainers:
    - name: verified-static-tools
      image: docker.io/library/arc-platform-web-tools-20261017@sha256:0d5fe73d622effec94798a9859382f9779ab5d026bbdcdbfb2930bd5ca48b7d5
      imagePullPolicy: Never
      command:
      - /bin/bash
      - -euc
      - |
        /opt/arc/bin/runner-preflight.sh security
        printf '1ce3db0d1efbea3c381b28599c54944d6b0e8ae65d410132992e49886765a3e0  /opt/arc/helm/helm\n' | sha256sum --check --status
        install -d /home/runner/_work/_tool/helm/4.2.1/x64
        install -m 0555 /opt/arc/helm/helm /home/runner/_work/_tool/helm/4.2.1/x64/helm
        touch /home/runner/_work/_tool/helm/4.2.1/x64.complete
        /home/runner/_work/_tool/helm/4.2.1/x64/helm version --short
        install -d /home/runner/_work/_tool/node/26.7.0
        ln -s /opt/arc/node /home/runner/_work/_tool/node/26.7.0/x64
        touch /home/runner/_work/_tool/node/26.7.0/x64.complete
        install -d /home/runner/_work/_npm-cache/_cacache
        cp -a /opt/arc/npm-cache/. /home/runner/_work/_npm-cache/_cacache/
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 16Mi
        limits:
          cpu: 250m
          memory: 256Mi
          ephemeral-storage: 64Mi
      volumeMounts:
      - name: work
        mountPath: /home/runner/_work
    containers:
    - name: runner
      image: docker.io/library/arc-platform-web-tools-20261017@sha256:0d5fe73d622effec94798a9859382f9779ab5d026bbdcdbfb2930bd5ca48b7d5
      imagePullPolicy: Never
      command:
      - /bin/bash
      - -ec
      - |
        /opt/arc/bin/runner-preflight.sh security
        test ! -S /run/user/1001/docker.sock
        /opt/arc/node/bin/node --version
        /opt/arc/node/bin/node -e 'console.log(JSON.stringify({node:process.version,v8_heap_limit:require("node:v8").getHeapStatistics().heap_size_limit}))'
        /opt/google/chrome/chrome --version
        fc-match system-ui
        fc-match "sans-serif:lang=ko"
        exec /home/runner/run.sh
      env:
      - name: DISABLE_RUNNER_UPDATE
        value: 'true'
      - name: RUNNER_TOOL_CACHE
        value: /home/runner/_work/_tool
      - name: NPM_CONFIG_CACHE
        value: /home/runner/_work/_npm-cache
      - name: NPM_CONFIG_OFFLINE
        value: 'true'
      - name: ARC_WEB_PACKAGE_LOCK_SHA256
        value: 0dc65a67b5997c7451c2b09a23b4671ac8e02d9b54f2137fb42324ddbe346c03
      - name: DOCKER_HOST
        value: unix:///run/user/1001/non-docker-disabled.sock
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
          ephemeral-storage: 512Mi
        limits:
          cpu: '1'
          memory: 1536Mi
          ephemeral-storage: 2Gi
      volumeMounts:
      - name: work
        mountPath: /home/runner/_work
    volumes:
    - name: work
      emptyDir:
        sizeLimit: 1536Mi
