{{- if and (ne (toJson .Values) (toJson (dict "keycloakPublicRoute" (dict "enabled" false)))) (ne (toJson .Values) (toJson (dict "keycloakPublicRoute" (dict "enabled" true)))) -}}
{{- fail "Public route blocked: only boolean keycloakPublicRoute.enabled is supported" -}}
{{- end -}}
{{- if .Values.keycloakPublicRoute.enabled -}}
{{- if or (ne .Release.Namespace "keycloak") (ne .Release.Name "keycloak-public-access") -}}
{{- fail "Public route blocked: exact namespace/release identity required" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-public
  namespace: keycloak
spec:
  hostnames:
    - sso.kkamji.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kkamji
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/kkamji
        - path:
            type: PathPrefix
            value: /resources
      backendRefs:
        - group: ""
          kind: Service
          name: keycloak-service
          port: 8080
          weight: 1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: keycloak-public-persistent-sso
  namespace: keycloak
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: keycloak-public
  lua:
    - type: Inline
      inline: |
{{ .Files.Get "files/persistent-sso-cookie.lua" | indent 8 }}
{{- end }}
