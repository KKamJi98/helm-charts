# One shared non-terminal job Pod across BOTH repository scale sets.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-pr
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-light-job
  namespace: ci-pr
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-control-budget
  namespace: arc-system
spec:
  # Controller plus three light listeners (Platform, BQL, terraform-lab) plus
  # one controller rollout surge (100m/500m, 128Mi/256Mi, 64Mi/128Mi).
  hard:
    requests.cpu: 350m
    requests.memory: 448Mi
    limits.cpu: 1750m
    limits.memory: 896Mi
    requests.ephemeral-storage: 320Mi
    limits.ephemeral-storage: 640Mi
    pods: '5'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-job-budget
  namespace: ci-pr
spec:
  hard:
    # One shared light job Pod (Platform or BQL: 1Gi/1536Mi each) plus the
    # terraform-lab Pod (512Mi/2Gi). Two light Pods never fit the memory
    # request budget together, so the light pools still run one at a time.
    requests.cpu: 750m
    requests.memory: 1536Mi
    limits.cpu: '3'
    limits.memory: 3584Mi
    requests.ephemeral-storage: 1536Mi
    limits.ephemeral-storage: 8Gi
    pods: '2'
    persistentvolumeclaims: '0'
