# Repository-scoped light runner namespaces and quotas (Platform + terraform-lab).
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-pr
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-light-job
  namespace: ci-pr
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-control-budget
  namespace: arc-system
spec:
  # Controller plus two light listeners (Platform, terraform-lab) plus
  # one controller rollout surge (100m/500m, 128Mi/256Mi, 64Mi/128Mi).
  hard:
    requests.cpu: 300m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 768Mi
    requests.ephemeral-storage: 256Mi
    limits.ephemeral-storage: 512Mi
    pods: '4'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-job-budget
  namespace: ci-pr
spec:
  hard:
    # One Platform light job Pod (1Gi/1536Mi) plus the terraform-lab Pod
    # (512Mi/2Gi). Two Platform light Pods never fit the memory request budget
    # together.
    requests.cpu: 750m
    requests.memory: 1536Mi
    limits.cpu: '3'
    limits.memory: 3584Mi
    requests.ephemeral-storage: 1536Mi
    limits.ephemeral-storage: 8Gi
    pods: '2'
    persistentvolumeclaims: '0'
