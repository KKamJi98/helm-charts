# One shared non-terminal job Pod across BOTH repository scale sets.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-pr
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-light-job
  namespace: ci-pr
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-control-budget
  namespace: arc-system
spec:
  hard:
    requests.cpu: 300m
    requests.memory: 384Mi
    limits.cpu: '1.5'
    limits.memory: 768Mi
    requests.ephemeral-storage: 256Mi
    limits.ephemeral-storage: 512Mi
    pods: '4'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-job-budget
  namespace: ci-pr
spec:
  hard:
    # One shared light job Pod (Platform or BQL: 1Gi/1536Mi each) plus the
    # terraform-lab Pod (512Mi/2Gi). Two light Pods never fit the memory
    # request budget together, so the light pools still run one at a time.
    requests.cpu: 750m
    requests.memory: 1536Mi
    limits.cpu: '3'
    limits.memory: 3584Mi
    requests.ephemeral-storage: 1536Mi
    limits.ephemeral-storage: 8Gi
    pods: '2'
    persistentvolumeclaims: '0'
