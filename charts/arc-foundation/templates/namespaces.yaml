# One shared non-terminal job Pod across BOTH repository scale sets.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-pr
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-light-job
  namespace: ci-pr
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-control-budget
  namespace: arc-system
spec:
  hard:
    requests.cpu: 300m
    requests.memory: 384Mi
    limits.cpu: '1.5'
    limits.memory: 768Mi
    requests.ephemeral-storage: 256Mi
    limits.ephemeral-storage: 512Mi
    pods: '4'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-job-budget
  namespace: ci-pr
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 1536Mi
    requests.ephemeral-storage: 1Gi
    limits.ephemeral-storage: 4Gi
    pods: '1'
    persistentvolumeclaims: '0'
