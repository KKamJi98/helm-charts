apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-platform-auth
  namespace: ci-pr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameter-store
    kind: ClusterSecretStore
  target:
    name: arc-platform-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: /kkamji/arc/platform-auth
---
