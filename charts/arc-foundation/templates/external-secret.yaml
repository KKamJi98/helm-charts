# {{- if .Values.githubAuth.enabled }}
# {{- if not (and .Values.arcSsmReuse.enabled .Values.arcSsmReuse.namespaceTrustAccepted .Values.arcSsmReuse.existingStoreTrustAccepted .Values.arcSsmReuse.keyChoiceApproved .Values.arcSsmReuse.secureInputMetadataVerified) }}
# {{- fail "ARC auth blocked: owner shared namespace/store trust, explicit key choice and user secure-input metadata are required; no default-key IAM expansion is proposed" }}
# {{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app-auth
  namespace: ci-pr
spec:
  refreshInterval: 1h
  secretStoreRef: {name: parameter-store, kind: ClusterSecretStore}
  target:
    name: arc-github-app-auth
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
  - extract: {key: /kkamji/arc/github-app}
# {{- end }}
---
# Kubelet pull credential for the private runner images (docs/arc-runner-images.md).
{{- if .Values.imagePullSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: ci-pr
spec:
  refreshInterval: 1h
  secretStoreRef: {name: parameter-store, kind: ClusterSecretStore}
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .token }}` }}","auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}
  data:
  - secretKey: username
    remoteRef: {key: /kkamji/personal/kkamji-platform/ghcr/pull-token, property: username}
  - secretKey: token
    remoteRef: {key: /kkamji/personal/kkamji-platform/ghcr/pull-token, property: token}
{{- end }}
