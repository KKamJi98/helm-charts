kind: ExternalSecret
metadata:
  name: arc-bql-auth
  namespace: ci-pr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameter-store
    kind: ClusterSecretStore
  target:
    name: arc-bql-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: /kkamji/arc/bql-auth
