# Narrow production overlay. Start with database phase, not the app.
# Apply after kkamji_local_values.yaml; values are references/public metadata only.
preparationProfile: keycloak-26.8.2-production
productionPhase: database
keycloak:
  instances: 1
  resources:
    requests:
      cpu: 50m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
publicCaProjection:
  enabled: true
database:
  instances: 1
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://kkamji-keycloak-pg-backup/keycloak
      # Omit serverName: the pinned CNPG default is the Cluster name, keycloak-db.
      s3Credentials:
        accessKeyId:
          name: keycloak-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: keycloak-backup-s3
          key: ACCESS_SECRET_KEY
        region:
          name: keycloak-backup-s3
          key: AWS_REGION
      data:
        compression: gzip
        encryption: AES256
      wal:
        compression: gzip
        encryption: AES256
