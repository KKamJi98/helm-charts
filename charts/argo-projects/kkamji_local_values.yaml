namespace: argocd

projects:
  argocd:
    description: "ArgoCD self-management (argo-cd, argocd-projects, root-applications)"
    sourceRepos:
      - "*"
    destinations:
      - server: https://kubernetes.default.svc
        namespace: "*"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  kuberca:
    description: "kube-rca demo workloads (bookinfo, load-generator, chaos-mesh, kuberca-monitoring)"
    sourceRepos:
      - "*"
    destinations:
      - server: https://kubernetes.default.svc
        namespace: "*"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  management:
    description: "Cluster management addons (CNI, ingress, observability, security)"
    sourceRepos:
      - "*"
    destinations:
      - server: https://kubernetes.default.svc
        namespace: "*"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  automation:
    description: "Automation tooling (openclaw, etc.)"
    sourceRepos:
      - "*"
    destinations:
      - server: https://kubernetes.default.svc
        namespace: "*"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  personal:
    description: "Personal projects (play-hub, lf-oss-na-2026)"
    sourceRepos:
      - "*"
    destinations:
      - server: https://kubernetes.default.svc
        namespace: "*"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  arc-ci:
    description: Repository-scoped light CI, no Docker or deployment credentials
    sourceRepos:
    - https://github.com/KKamJi98/helm-charts.git
    destinations:
    - server: https://kubernetes.default.svc
      namespace: arc-system
    - server: https://kubernetes.default.svc
      namespace: ci-pr
    clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    namespaceResourceWhitelist:
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: ResourceQuota
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: apps
      kind: Deployment
    - group: actions.github.com
      kind: AutoscalingRunnerSet
    - group: external-secrets.io
      kind: ExternalSecret
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
