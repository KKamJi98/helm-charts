# Istio istiod values for kkamji-lab (Ambient Mode, non-HA, sidecarless)
# Upstream chart baseline: istio/istiod 1.31.4 (supports K8s 1.32 - 1.37)

profile: ambient

global:
  istioNamespace: istio-system
  # istiod needs cluster-scoped RBAC to watch the istio config ConfigMap and related resources.
  # istio-base still owns CRDs; istio-istiod owns its runtime RBAC.
  resourceScope: all

  # Right-sized worker-only defaults if an opt-in L7 Waypoint Proxy is ever deployed.
  waypoint:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    tolerations: []
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
                - key: node-role.kubernetes.io/master
                  operator: DoesNotExist

# Never inject legacy Envoy sidecars by default or onto any Ambient-enrolled workload.
sidecarInjectorWebhook:
  enableNamespacesByDefault: false
  neverInjectSelector:
    - matchLabels:
        istio.io/dataplane-mode: ambient

# Non-HA minimal footprint (2026-11-23): disable HPA and size from 7d peak (4.2m / 148Mi).
autoscaleEnabled: false
replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 160Mi
  limits:
    memory: 320Mi

# Mesh config used to generate istio configmap.
meshConfig:
  # Tempo 제거 후 trace 수신 백엔드가 없으므로 tracing 을 끈다.
  enableTracing: false
  defaultProviders:
    metrics:
      - prometheus
