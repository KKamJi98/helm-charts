# Istio istiod values for kkamji-lab (Ambient Mode, non-HA)
# Upstream chart baseline: istio/istiod 1.31.4 (supports K8s 1.32 - 1.37)

profile: ambient

global:
  istioNamespace: istio-system
  # istiod needs cluster-scoped RBAC to watch the istio config ConfigMap and related resources.
  # istio-base still owns CRDs; istio-istiod owns its runtime RBAC.
  resourceScope: all

  # Keep proxy tracer disabled to rely on meshConfig extensionProviders.
  proxy:
    tracer: none
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 512Mi

# Non-HA minimal footprint (2026-11-23): disable HPA and size from 7d peak (4.2m / 148Mi).
autoscaleEnabled: false
replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 160Mi
  limits:
    memory: 320Mi

# Mesh config used to generate istio configmap.
meshConfig:
  # Tempo 제거 후 trace 수신 백엔드가 없으므로 sidecar/waypoint tracing 을 끈다.
  enableTracing: false
  defaultProviders:
    metrics:
      - prometheus
