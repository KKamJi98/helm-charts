global:
  # kubespray-deployed CoreDNS service is named "coredns", not the upstream
  # default "kube-dns"; loki-gateway nginx resolver fails to start otherwise.
  dnsService: coredns
  # kube-prometheus-stack 차트가 만드는 관측 스택 PriorityClass.
  priorityClassName: kkamji-observability

loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        # SingleBinary 1 replica 라 MinIO 없이 /var/loki PVC 에 직접 저장한다.
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h
    # retention 보다 오래된 로그는 받자마자 compactor 삭제 대상이므로 수집 단계에서 거부한다.
    reject_old_samples_max_age: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  storage:
    type: filesystem
  rulerConfig:
    enable_api: true
    # filesystem 모드의 ruler local store 를 loki-sc-rules sidecar 경로와 맞춘다.
    storage:
      type: local
      local:
        directory: /rules

minio:
  enabled: false

# canary 메트릭을 수집하는 ServiceMonitor 가 없어 결과를 쓰지 않는다.
# helm test 는 canary 에 의존하므로 함께 끈다.
lokiCanary:
  enabled: false
test:
  enabled: false

deploymentMode: SingleBinary

# requests: 2026-10-18 기준 24h working set p95 에 여유를 더한 값. CPU limit 은 두지 않는다.
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 640Mi

gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# loki-sc-rules sidecar
sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

############### Resource constraint로 인해 해제  

chunksCache:
  enabled: false
resultsCache: 
  enabled: false
