# Istio CNI node agent for kkamji-lab (Ambient Mode, worker-only)
# Upstream chart baseline: istio/cni 1.31.4 (supports K8s 1.32 - 1.37)

profile: ambient

chained: true
cniBinDir: /opt/cni/bin
cniConfDir: /etc/cni/net.d

ambient:
  enabled: true
  dnsCapture: true
  reconcileIptablesOnStartup: true

# Defense-in-depth: never capture infrastructure, CNI, Gateway, monitoring, or CI runner namespaces.
excludeNamespaces:
  - kube-system
  - istio-system
  - metallb-system
  - cilium-secrets
  - envoy-gateway-system
  - cert-manager
  - external-secrets
  - external-dns
  - cnpg-system
  - argocd
  - monitoring
  - security
  - arc-system
  - arc-runtime
  - ci-pr
  - ci-full
  - ci-cache

# K8s >= 1.30 uses native securityContext.appArmorProfile instead of deprecated beta annotation.
useAppArmorAnnotation: false

# CRITICAL k8s-m1 RAM guard: never run ambient CNI agent on the 4GiB control-plane node.
tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
            - key: node-role.kubernetes.io/master
              operator: DoesNotExist

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
