# Envoy Gateway (Gateway API) - 플랫폼 계층.
#
# 역할 분리 (Gateway API persona model):
#   - 이 차트(플랫폼): GatewayClass, Gateway(wildcard listener/TLS/IP),
#     https 리다이렉트, wildcard Certificate 만 소유한다.
#   - HTTPRoute 는 전부 각 앱 차트가 소유한다:
#       kube-prometheus-stack: templates/gateway-routes.yaml (grafana/prom/am)
#       cilium:                templates/gateway-routes.yaml (hubble)
#       argocd:                upstream server.httproute (Terminate 통일, 2026-08-31)
#       play-hub repo:         templates/httproute.yaml
#   - 신규 서비스 온보딩 = 자기 차트에 HTTPRoute 추가
#     (parentRef {name: kkamji, namespace: envoy-gateway-system, sectionName: https})

gateway-helm:
  config:
    envoyGateway:
      extensionApis:
        # Required by Keycloak consumer SecurityPolicies for Backend strict upstream TLS + DNS SAN verification.
        enableBackend: true
  deployment:
    envoyGateway:
      # Homelab right-sizing (2026-11-23): live usage 3m / 48Mi vs 100m / 256Mi upstream default.
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 384Mi

keycloakAdminPrivate:
  enabled: true

# Dedicated ClusterIP, GET discovery only; not an owner login route.
keycloakOwnerDiscovery:
  enabled: true

gateway:
  name: kkamji
  className: envoy
  # Windows host portproxy(80/443) 타깃
  lbIP: 10.0.1.100
  externalDNSTarget: 121.130.214.237
  issuer: letsencrypt-prod
  wildcardHost: "*.kkamji.net"
  publicProxy:
    name: kkamji-public
    # Strip query strings (OAuth callback code/state) and omit auth/cookie/referer/identity headers in stdout access logs.
    stripQueryAccessLog: true
    # Homelab right-sizing (2026-11-23): single Envoy worker thread and bounded Burstable resources
    # (live 5m / 151Mi vs 100m / 512Mi upstream default).
    concurrency: 1
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi

# TLS passthrough 리스너는 폐지(2026-08-31). 443 단일 Terminate 리스너로 통일 -
# 다중 443 리스너 잔존 시 EG hostname intersection 이 깨져 신규 HTTPRoute 가
# NoMatchingListenerHostname 로 탈락한다. argocd 는 server.insecure + HTTPRoute.
