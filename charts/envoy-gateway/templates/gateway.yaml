{{- if and .Values.gateway.publicProxy .Values.gateway.publicProxy.stripQueryAccessLog }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.publicProxy.name }}
  namespace: {{ .Release.Namespace }}
spec:
{{- if .Values.gateway.publicProxy.concurrency }}
  concurrency: {{ .Values.gateway.publicProxy.concurrency }}
{{- end }}
{{- if or .Values.gateway.publicProxy.replicas .Values.gateway.publicProxy.resources }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
{{- if .Values.gateway.publicProxy.replicas }}
        replicas: {{ .Values.gateway.publicProxy.replicas }}
{{- end }}
{{- if .Values.gateway.publicProxy.resources }}
        container:
          resources:
{{ toYaml .Values.gateway.publicProxy.resources | indent 12 }}
{{- end }}
{{- end }}
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              x-envoy-upstream-service-time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              x-forwarded-for: "%REQ(X-FORWARDED-FOR)%"
              user-agent: "%REQ(USER-AGENT)%"
              x-request-id: "%REQ(X-REQUEST-ID)%"
              ":authority": "%REQ(:AUTHORITY)%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              requested_server_name: "%REQUESTED_SERVER_NAME%"
              route_name: "%ROUTE_NAME%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # external-dns 는 gateway 소스에서 route 가 아닌 Gateway 의 target 을 본다.
    # 누락 시 내부 LB IP(10.0.1.100)가 A 레코드로 들어가 외부 접근이 끊긴다.
    external-dns.alpha.kubernetes.io/target: {{ .Values.gateway.externalDNSTarget | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    annotations:
      # Windows host portproxy 가 바라보는 IP 를 MetalLB 에서 고정
      metallb.io/loadBalancerIPs: {{ .Values.gateway.lbIP | quote }}
{{- if and .Values.gateway.publicProxy .Values.gateway.publicProxy.stripQueryAccessLog }}
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gateway.publicProxy.name }}
{{- end }}
  listeners:
    # HTTP: https 리다이렉트 용 (templates/http-route.yaml)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # 모든 HTTPS 트래픽을 받는 wildcard 리스너. 앱 차트의 HTTPRoute 는
    # sectionName: https 로 붙는다.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.wildcardHost | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-kkamji-net-tls
      allowedRoutes:
        namespaces:
          from: All
{{- range .Values.tlsPassthroughListeners }}
    # SNI 가 정확히 일치하는 호스트는 wildcard 보다 우선 매칭된다 (passthrough).
    # TLSRoute 는 해당 앱 차트가 sectionName: tls-{{ .name }} 으로 붙인다.
    - name: tls-{{ .name }}
      protocol: TLS
      port: 443
      hostname: {{ .host | quote }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
