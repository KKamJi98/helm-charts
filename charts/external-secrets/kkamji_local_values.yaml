external-secrets:
  installCRDs: true
  crds:
    unsafeServeV1Beta1: true
  # Bounded Burstable resources from 7d metrics (controller max 2.0m/153.3Mi,
  # cert-controller max 1.8m/161.9Mi, webhook max 0.8m/140.0Mi).
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 256Mi
  certController:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 256Mi
  webhook:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 256Mi

clusterSecretStore:
  name: parameter-store
  region: ap-northeast-2
  authSecretRef:
    namespace: external-secrets
    name: awssm-secret
    accessKeyIDKey: access-key
    secretAccessKeyKey: secret-access-key
