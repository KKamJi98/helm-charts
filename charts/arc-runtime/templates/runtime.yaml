{{- if .Values.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runtime
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runtime
  namespace: arc-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-runtime-profile
  namespace: arc-runtime
data:
  arc-docker-runtime-v2.json: |
{{ .Files.Get "files/seccomp/arc-docker-runtime-v2.json" | indent 4 }}
  install-profile.sh: |
{{ .Files.Get "files/install-profile.sh" | indent 4 }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runtime-budget
  namespace: arc-runtime
spec:
  hard:
    pods: "4"
    requests.cpu: 200m
    limits.cpu: 800m
    requests.memory: 256Mi
    limits.memory: 512Mi
    persistentvolumeclaims: "0"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: arc-runtime
  namespace: arc-runtime
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: arc-runtime}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: arc-runtime}
      annotations:
        checksum/runtime-profile: {{ .Files.Get "files/seccomp/arc-docker-runtime-v2.json" | sha256sum }}
        checksum/profile-installer: {{ .Files.Get "files/install-profile.sh" | sha256sum }}
    spec:
      serviceAccountName: arc-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      priorityClassName: arc-ci-nonpreempting
      nodeSelector: {kubernetes.io/os: linux}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
              - {key: node-role.kubernetes.io/master, operator: DoesNotExist}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: install-runtime-profile
        image: docker.io/library/busybox@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
        command: [sh, /profiles/install-profile.sh]
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 32Mi}
        volumeMounts:
        - {name: profile, mountPath: /profiles, readOnly: true}
        - {name: seccomp, mountPath: /host-seccomp}
      containers:
      - name: tun-device-plugin
        image: docker.io/squat/generic-device-plugin@sha256:bf312a67334be792d3a3d3042c99225aec469957dc1737911970aebbf82d1545
        args:
        - --listen=:8080
        - --domain=kkamji.net
        - '--device={"name":"arc-tun","groups":[{"count":1,"paths":[{"path":"/dev/net/tun","mountPath":"/dev/net/tun","permissions":"rw","type":"Device"}]}]}'
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        ports: [{name: health, containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /health, port: health}
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - {name: registration, mountPath: /var/lib/kubelet/device-plugins}
        - {name: device-discovery, mountPath: /dev/net, readOnly: true}
      volumes:
      - name: profile
        configMap: {name: arc-runtime-profile, defaultMode: 0444}
      - name: seccomp
        hostPath: {path: /var/lib/kubelet/seccomp, type: DirectoryOrCreate}
      - name: registration
        hostPath: {path: /var/lib/kubelet/device-plugins, type: Directory}
      - name: device-discovery
        hostPath: {path: /dev/net, type: Directory}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runtime-no-network
  namespace: arc-runtime
spec:
  endpointSelector: {}
  ingress: []
  egress: []
{{- end }}
