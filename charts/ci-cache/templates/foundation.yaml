apiVersion: v1
kind: Namespace
metadata:
  name: ci-cache
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cache-budget
  namespace: ci-cache
spec:
  # One zot Pod; Recreate never runs two. The ephemeral limit bounds the store
  # emptyDir (30Gi) plus /tmp (1Gi).
  hard:
    pods: "1"
    requests.cpu: 100m
    limits.cpu: "1"
    requests.memory: 256Mi
    limits.memory: 1Gi
    requests.ephemeral-storage: 30Gi
    limits.ephemeral-storage: 31Gi
    persistentvolumeclaims: "0"
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cache-default-deny
  namespace: ci-cache
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
# Only ci-full job Pods reach the registry. Light (ci-pr) runners, other
# namespaces and the outside cannot.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cache-from-full-jobs
  namespace: ci-cache
spec:
  endpointSelector:
    matchLabels: {arc.kkamji.net/role: cache}
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: ci-full
        arc.kkamji.net/role: job
    toPorts:
    - ports: [{port: "5000", protocol: TCP}]
---
# Docker Hub only: the registry, its token service and the blob CDNs it
# redirects to (production.cloudfront.docker.com observed 2026-10-19).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cache-upstream
  namespace: ci-cache
spec:
  endpointSelector:
    matchLabels: {arc.kkamji.net/role: cache}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports: [{port: "53", protocol: ANY}]
      rules:
        dns:
        - {matchName: registry-1.docker.io}
        - {matchName: auth.docker.io}
        - {matchName: production.cloudfront.docker.com}
        - {matchName: production.cloudflare.docker.com}
        - {matchName: docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com}
  - toFQDNs:
    - {matchName: registry-1.docker.io}
    - {matchName: auth.docker.io}
    - {matchName: production.cloudfront.docker.com}
    - {matchName: production.cloudflare.docker.com}
    - {matchName: docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com}
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
