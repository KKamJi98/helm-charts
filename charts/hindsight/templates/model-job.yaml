{{- $name := required "name is required" .Values.name -}}
{{- $repo := required "model.repo is required" .Values.model.repo -}}
{{- $revision := required "model.revision is required" .Values.model.revision -}}
{{- if or (ne $repo "intfloat/multilingual-e5-small") (ne $revision "614241f622f53c4eeff9890bdc4f31cfecc418b3") -}}
{{- fail "model bootstrap accepts only the approved exact public E5 revision" -}}
{{- end -}}
{{- $manifest := required "model.filesSha256 must supply the public file checksums" .Values.model.filesSha256 -}}
{{- $image := required "runtime.image must be a digest-pinned official image" .Values.runtime.image -}}
{{- if not (regexMatch "^ghcr[.]io/vectorize-io/hindsight(:[^@]+)?@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "runtime.image must be the full official ghcr.io/vectorize-io/hindsight image with @sha256" -}}
{{- end -}}
{{- /* All input changes select a new Job identity instead of patching an immutable Pod spec. */ -}}
{{- /* Bump schemaVersion for literal Pod-spec changes (resources, volumes, env). */ -}}
{{- $jobSpec := dict "schemaVersion" 1 "image" $image "repo" $repo "revision" $revision "manifest" $manifest "nodeSelector" .Values.runtime.nodeSelector "script" (.Files.Get "files/prepare_model.py") -}}
{{- $jobHash := $jobSpec | toJson | sha256sum | trunc 12 -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-model-{{ $jobHash }}
  annotations:
    # Same wave as the model PVC: the Job is its WFFC first consumer.
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: model-init
spec:
  # A failed download requires investigation and an explicit manual rerun.
  # Do not add a hook/TTL: deleting a completed Job would recreate it on sync.
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: model-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.runtime.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare-model
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "/bootstrap/prepare_model.py"]
          args:
            - --repo
            - {{ $repo | quote }}
            - --revision
            - {{ $revision | quote }}
            - --manifest
            - /bootstrap/files-sha256.json
            - --model-dir
            - /models/e5-small
          env:
            - name: HF_HUB_DISABLE_IMPLICIT_TOKEN
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: HF_HOME
              value: /home/hindsight/.cache/huggingface
            - name: XDG_CACHE_HOME
              value: /home/hindsight/.cache
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/hindsight/.cache
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ $name }}-models
        - name: bootstrap
          configMap:
            name: {{ $name }}-model-bootstrap
            defaultMode: 0444
            items:
              - key: prepare_model.py
                path: prepare_model.py
              - key: files-sha256.json
                path: files-sha256.json
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
