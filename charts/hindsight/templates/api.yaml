{{- $name := required "name is required" .Values.name -}}
{{- $image := required "runtime.image must be a digest-pinned official image" .Values.runtime.image -}}
{{- if not (regexMatch "^ghcr[.]io/vectorize-io/hindsight(:[^@]+)?@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "runtime.image must be the full official ghcr.io/vectorize-io/hindsight image with @sha256" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: api
spec:
  serviceName: {{ $name }}-api
  replicas: 1
  # OrderedReady plus default RollingUpdate replaces ordinal 0 only after its
  # old Pod terminates. Never substitute a surging Deployment or force delete.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        {{- toYaml .Values.runtime.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-auth
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "/bootstrap/seed_auth.py"]
          env:
            - name: AUTH_HOME
              value: /auth/chatgpt
            - name: SEED_DIR
              value: /seed
            - name: MODEL_DIR
              value: /models/e5-small
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HF_HUB_DISABLE_IMPLICIT_TOKEN
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: chatgpt
              mountPath: /auth
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          # Use the full official image's startup path and embedded pg0.
          command: ["/app/start-all.sh"]
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ required "auth.apiSecretName is required" .Values.auth.apiSecretName | quote }}
                optional: false
          env:
            - name: HINDSIGHT_ENABLE_CP
              value: "false"
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            - name: HINDSIGHT_API_TENANT_MCP_AUTH_DISABLED
              value: "false"
            - name: HINDSIGHT_API_ENABLE_DOCUMENT_IMPORT_API
              value: "true"
            - name: HINDSIGHT_API_ENABLE_DOCUMENT_EXPORT_API
              value: "true"
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: chatgpt
            - name: HINDSIGHT_API_LLM_MODEL
              value: {{ required "runtime.model is required" .Values.runtime.model | quote }}
            - name: HINDSIGHT_API_LLM_REASONING_EFFORT
              value: {{ required "runtime.reasoningEffort is required" .Values.runtime.reasoningEffort | quote }}
            - name: HINDSIGHT_API_LLM_CHATGPT_HOME
              value: /auth/chatgpt
            - name: HINDSIGHT_API_LLM_MAX_CONCURRENT
              value: "1"
            - name: HINDSIGHT_API_WORKERS
              value: "1"
            - name: HINDSIGHT_API_WORKER_ENABLED
              value: "true"
            - name: HINDSIGHT_API_HOST
              value: "0.0.0.0"
            - name: HINDSIGHT_API_PORT
              value: "8888"
            - name: HINDSIGHT_API_EMBEDDINGS_PROVIDER
              value: onnx
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_ID
              value: {{ .Values.model.repo | quote }}
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_PATH
              value: /models/e5-small/onnx/model.onnx
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_TOKENIZER_NAME_OR_PATH
              value: /models/e5-small
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_DEVICE
              value: cpu
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_DIMENSIONS
              value: "384"
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_MAX_TOKENS
              value: "512"
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_POOLING
              value: mean
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_NORMALIZE
              value: "true"
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_QUERY_PREFIX
              value: "query: "
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_PASSAGE_PREFIX
              value: "passage: "
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_BATCH_SIZE
              value: "8"
            - name: HINDSIGHT_API_EMBEDDINGS_ONNX_CPU_MEM_ARENA
              value: "false"
            - name: HINDSIGHT_API_RERANKER_PROVIDER
              value: rrf
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_IMPLICIT_TOKEN
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: HF_HOME
              value: /home/hindsight/.cache/huggingface
            - name: XDG_CACHE_HOME
              value: /home/hindsight/.cache
            - name: OMP_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.runtime.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /home/hindsight/.pg0
            - name: chatgpt
              mountPath: /auth
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/hindsight/.cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: chatgpt
          persistentVolumeClaim:
            claimName: {{ $name }}-chatgpt
        - name: models
          persistentVolumeClaim:
            claimName: {{ $name }}-models
            readOnly: true
        - name: seed
          secret:
            secretName: {{ required "auth.seedSecretName is required" .Values.auth.seedSecretName | quote }}
            optional: true
            defaultMode: 0440
        - name: bootstrap
          configMap:
            name: {{ $name }}-bootstrap
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: api
