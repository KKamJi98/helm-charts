name: hindsight

runtime:
  image: ghcr.io/kkamji98/hindsight-security:1.1.0-20261029@sha256:99f91e62f5e870d91a2e03bb3fce695541dff694dac6dcdb692319f462060074
  model: ""
  reasoningEffort: ""
  nodeSelector:
    kubernetes.io/hostname: k8s-w2
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 6Gi

storage:
  storageClass: local-path
  databaseSize: 8Gi
  authSize: 1Gi
  modelSize: 2Gi

auth:
  apiSecretName: hindsight-api-auth
  controlPlaneSecretName: hindsight-control-plane-auth
  seedSecretName: hindsight-chatgpt-seed
  ssmKey: /kkamji/automation/hindsight/access
  edgeSsmKey: /kkamji/automation/hindsight/edge-auth
  secretStoreName: parameter-store
  refreshInterval: 1h

model:
  repo: intfloat/multilingual-e5-small
  revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  filesSha256:
    config.json: 69137736cab8b8903a07fe8afaafdda25aac55415a12a55d1bffa9f581abf959
    onnx/model.onnx: ca456c06b3a9505ddfd9131408916dd79290368331e7d76bb621f1cba6bc8665
    sentencepiece.bpe.model: cfc8146abe2a0488e9e2a0c56de7952f7c11ab059eca145a0a727afce0db2865
    special_tokens_map.json: d05497f1da52c5e09554c0cd874037a083e1dc1b9cfd48034d1c717f1afc07a7 # gitleaks:allow - public model SHA256
    tokenizer.json: 0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39 # gitleaks:allow - public model SHA256
    tokenizer_config.json: a1d6bc8734a6f635dc158508bef000f8e2e5a759c7d92f984b2c86e5ff53425b # gitleaks:allow - public model SHA256

exposure:
  enabled: false
  hostname: hindsight.kkamji.net
  oidc:
    # Public Google client ID, shared by OIDC and the JWT audience restriction.
    clientID: 47443292322-rlsttvfbbvbp3lg5icerudodded0i7ev.apps.googleusercontent.com
  gateway:
    name: kkamji
    namespace: envoy-gateway-system
    sectionName: https

server:
  fullnameOverride: hindsight
  nameOverride: hindsight
  existingSecret: hindsight-control-plane-auth
  api:
    enabled: false
  worker:
    enabled: false
  postgresql:
    enabled: false
  controlPlane:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/vectorize-io/hindsight-control-plane
      tag: "1.1.0@sha256:373f86848649a8dadc9b2d9ecf1d18b4c446162ca7b556fc4152e92ef433e983"
    service:
      type: ClusterIP
      port: 3000
      targetPort: 3000
    env:
      NODE_ENV: production
      HOME: /tmp
      NEXT_TELEMETRY_DISABLED: "1"
      HINDSIGHT_CP_HOSTNAME: 0.0.0.0
      HINDSIGHT_CP_PORT: "3000"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    extraInitContainers:
      - name: require-private-access
        image: ghcr.io/vectorize-io/hindsight-control-plane:1.1.0@sha256:373f86848649a8dadc9b2d9ecf1d18b4c446162ca7b556fc4152e92ef433e983
        command:
          - node
          - -e
          - "if (!process.env.HINDSIGHT_CP_ACCESS_KEY || !process.env.HINDSIGHT_CP_DATAPLANE_API_KEY) process.exit(1)"
        env:
          - name: HINDSIGHT_CP_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: hindsight-control-plane-auth
                key: HINDSIGHT_CP_ACCESS_KEY
          - name: HINDSIGHT_CP_DATAPLANE_API_KEY
            valueFrom:
              secretKeyRef:
                name: hindsight-control-plane-auth
                key: HINDSIGHT_CP_DATAPLANE_API_KEY
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
  ingress:
    enabled: false
  gatewayApi:
    enabled: false
  serviceAccount:
    create: false
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: false
  nodeSelector:
    kubernetes.io/hostname: k8s-w2
  autoscaling:
    enabled: false
