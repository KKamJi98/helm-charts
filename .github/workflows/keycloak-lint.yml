name: Keycloak charts
on:
  pull_request:
    paths:
      - "charts/keycloak-operator/**"
      - "charts/keycloak-idp/**"
      - "charts/keycloak-admin-access/**"
      - "charts/keycloak-public-access/**"
      - "charts/envoy-gateway/values.yaml"
      - "charts/envoy-gateway/kkamji_local_values.yaml"
      - "charts/envoy-gateway/templates/keycloak-admin-private.yaml"
      - "charts/envoy-gateway/templates/keycloak-owner-discovery.tpl"
      - "charts/envoy-gateway/values.schema.json"
      - "charts/argo-applications/**"
      - "examples/keycloak-preparation/**"
      - "tests/test_keycloak*.py"
      - "tests/fixtures/keycloak-idp/**"
      - "tests/fixtures/keycloak-owner-discovery/**"
      - ".github/workflows/keycloak-lint.yml"
  push:
    branches: [main]
    paths:
      - "charts/keycloak-operator/**"
      - "charts/keycloak-idp/**"
      - "charts/keycloak-admin-access/**"
      - "charts/keycloak-public-access/**"
      - "charts/envoy-gateway/values.yaml"
      - "charts/envoy-gateway/kkamji_local_values.yaml"
      - "charts/envoy-gateway/templates/keycloak-admin-private.yaml"
      - "charts/envoy-gateway/templates/keycloak-owner-discovery.tpl"
      - "charts/envoy-gateway/values.schema.json"
      - "charts/argo-applications/**"
      - "examples/keycloak-preparation/**"
      - "tests/test_keycloak*.py"
      - "tests/fixtures/keycloak-idp/**"
      - "tests/fixtures/keycloak-owner-discovery/**"
      - ".github/workflows/keycloak-lint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.12"
      - name: Offline Keycloak preparation, CA, production and GitOps contracts
        run: |
          export HELM_BIN="$(command -v helm)"
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema --with lupa \
            python -m unittest discover -s tests -p 'test_keycloak*.py' -v
