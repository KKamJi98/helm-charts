name: Build Hindsight Dot Candidate

# PRs build/test only. Publishing requires an explicit manual dispatch.
on:
  pull_request:
    paths:
      - "images/hindsight-dot/**"
      - ".github/workflows/build-hindsight-dot.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested commit-SHA image to GHCR (no deployment)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hindsight-dot-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image_id: ${{ steps.identity.outputs.image_id }}
    env:
      IMAGE: ghcr.io/kkamji98/hindsight-dot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 locally in runner
        uses: docker/build-push-action@v6
        with:
          context: ./images/hindsight-dot
          file: ./images/hindsight-dot/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Offline, non-root runtime and scanner tests
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e DOT_TEST_SCANNER=/usr/local/bin/gitleaks \
            -e PYTHONPATH=/tests:/app \
            -v "$PWD/images/hindsight-dot/test_service.py:/tests/test_service.py:ro" \
            -v "$PWD/images/hindsight-dot/test_flow_base.py:/tests/test_flow_base.py:ro" \
            -v "$PWD/images/hindsight-dot/test_rate_limit.py:/tests/test_rate_limit.py:ro" \
            "$IMAGE:${{ github.sha }}" \
            python -m unittest test_service.ServiceTests test_service.StateTests test_rate_limit -q
      - name: Record tested image identity
        id: identity
        run: |
          image_id=$(docker image inspect "$IMAGE:${{ github.sha }}" --format '{{.Id}}')
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          docker image inspect "$IMAGE:${{ github.sha }}" --format '{{.Id}} {{.Os}}/{{.Architecture}}'
      - name: Export tested image for explicit publish only
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'KKamJi98/helm-charts'
        run: docker save "$IMAGE:${{ github.sha }}" | gzip > "$RUNNER_TEMP/hindsight-dot-image.tar.gz"
      - name: Keep tested image artifact briefly
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'KKamJi98/helm-charts'
        uses: actions/upload-artifact@v4
        with:
          name: hindsight-dot-image-${{ github.sha }}
          path: ${{ runner.temp }}/hindsight-dot-image.tar.gz
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'KKamJi98/helm-charts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kkamji98/hindsight-dot
      EXPECTED_IMAGE_ID: ${{ needs.candidate.outputs.image_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hindsight-dot-image-${{ github.sha }}
          path: ${{ runner.temp }}/image
      - name: Load and verify exact tested image
        run: |
          gzip -dc "$RUNNER_TEMP/image/hindsight-dot-image.tar.gz" | docker load
          actual=$(docker image inspect "$IMAGE:${{ github.sha }}" --format '{{.Id}}')
          test "$actual" = "$EXPECTED_IMAGE_ID"
      - name: Log in for explicitly requested publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-SHA tag only (pin digest for deployment)
        run: docker push "$IMAGE:${{ github.sha }}"
