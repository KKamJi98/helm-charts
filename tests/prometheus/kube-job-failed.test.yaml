    values: 1+0x800
  - series: kube_cronjob_status_last_successful_time{job="kube-state-metrics",namespace="real-life-rpg",cronjob="real-life-rpg-scheduler"}
    values: 50+0x800
  alert_rule_test:
  - eval_time: 14m
    alertname: KubeJobFailed
    exp_alerts: []
  - eval_time: 15m
    alertname: KubeJobFailed
    exp_alerts:
    - exp_labels:
        job: kube-state-metrics
        namespace: real-life-rpg
        job_name: real-life-rpg-scheduler-29928510
        condition: 'true'
        severity: warning
      exp_annotations:
        summary: Job failed to complete.
        description: Job real-life-rpg/real-life-rpg-scheduler-29928510 failed to complete. Removing failed job after investigation
          should clear this alert on cluster .
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
  - eval_time: 30m
    alertname: KubeJobFailed
    exp_alerts:
