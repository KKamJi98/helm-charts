# Synthetic lifecycle inputs based on observed kube-state-metrics metric/label names.
evaluation_interval: 1m
tests:
- name: historical scheduler failure stays silent beyond notification repeat interval
  interval: 1m
  input_series:
  - series: kube_job_failed{job="kube-state-metrics",namespace="real-life-rpg",job_name="real-life-rpg-scheduler-29928510",condition="true"}
    values: 1+0x800
  - series: kube_job_status_start_time{job="kube-state-metrics",namespace="real-life-rpg",job_name="real-life-rpg-scheduler-29928510"}
    values: 100+0x800
  - series: kube_job_owner{job="kube-state-metrics",namespace="real-life-rpg",job_name="real-life-rpg-scheduler-29928510",owner_kind="CronJob",owner_name="real-life-rpg-scheduler",owner_is_controller="true"}
    values: 1+0x800
  - series: kube_cronjob_status_last_successful_time{job="kube-state-metrics",namespace="real-life-rpg",cronjob="real-life-rpg-scheduler"}
    values: 200+0x800
  alert_rule_test:
  - eval_time: 14m
    alertname: KubeJobFailed
    exp_alerts: []
  - eval_time: 15m
    alertname: KubeJobFailed
    exp_alerts: []
  - eval_time: 30m
    alertname: KubeJobFailed
    exp_alerts: []
  - eval_time: 720m
    alertname: KubeJobFailed
    exp_alerts: []
- name: ongoing failure after previous success
  interval: 1m
  input_series:
